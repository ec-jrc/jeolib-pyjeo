name: Build Cross-Platform Wheels

# NOTE: Cross-platform wheel building is a work in progress and currently
# fails in the cibuildwheel manylinux container. Automatic triggers are
# disabled for now so it does not fail on every push; run it manually from
# the Actions tab (workflow_dispatch) when working on wheel support.
on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # We testen eerst Linux en macOS op deze branch
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true  # Cruciaal voor miallib en jiplib
          fetch-depth: 0    # Zorgt dat scikit-build-core git versies goed kan lezen

      - name: Set up QEMU (Voor eventuele ARM64 Linux builds later)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
